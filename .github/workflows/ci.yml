name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and scan PHP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        working-directory: backend
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: find backend/src backend/public backend/tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Audit PHP dependencies
        working-directory: backend
        run: composer audit

      - name: Validate Docker Compose
        run: docker compose config --quiet

  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Execute PHPUnit tests
        working-directory: backend
        run: composer test

  sast:
    name: SAST with Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Scan PHP source code
        run: semgrep scan --config auto --error backend/src backend/public

  build:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    needs:
      - validate
      - test
      - sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build application image
        run: docker build --tag web-course-dashboard:${{ github.sha }} ./backend