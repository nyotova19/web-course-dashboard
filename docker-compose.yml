services:
  php:
    build: ./backend
    container_name: webcourse_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    networks:
      - webcourse_net
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # The app reads MARIA_URI (see backend/src/Config/Database.php).
      # For local dev it must point at the "mariadb" service, NOT the remote host.
      MARIA_URI: mysql://${MARIA_USER:-webuser}:${MARIA_PASSWORD:-webpass}@mariadb:3306/${MARIA_DB:-webcourse}
      MARIA_DB: ${MARIA_DB:-webcourse}
      JWT_SECRET: ${JWT_SECRET:-changeme_super_secret_key_2025}
      APP_ENV: ${APP_ENV:-development}

  nginx:
    image: nginx:alpine
    container_name: webcourse_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/var/www/frontend
      - ./backend/public:/var/www/html/public
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - webcourse_net
    depends_on:
      - php

  mariadb:
    image: mariadb:11
    container_name: webcourse_mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    networks:
      - webcourse_net
    environment:
      MYSQL_DATABASE: ${MARIA_DB:-webcourse}
      MYSQL_USER: ${MARIA_USER:-webuser}
      MYSQL_PASSWORD: ${MARIA_PASSWORD:-webpass}
      MYSQL_ROOT_PASSWORD: ${MARIA_ROOT_PASSWORD:-rootpass}
    volumes:
      - mariadb_data:/var/lib/mysql
      # schema.sql + seed.sql run automatically on first start (empty volume only).
      # Files run in alphabetical order, so 01-schema.sql before 02-seed.sql.
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:

networks:
  webcourse_net:
    driver: bridge
