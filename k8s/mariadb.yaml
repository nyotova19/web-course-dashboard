apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: web-course
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: web-course
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
spec:
  serviceName: mariadb
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306

          env:
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: web-course-config
                  key: MARIADB_DATABASE

            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: web-course-secrets
                  key: MARIADB_USER

            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-course-secrets
                  key: MARIADB_PASSWORD

            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-course-secrets
                  key: MARIADB_ROOT_PASSWORD

          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10

          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql

            - name: mariadb-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

      volumes:
        - name: mariadb-init
          configMap:
            name: mariadb-init

  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi